services:
  - type: web
    name: casino-royale-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - README.md
        - test/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: ALLOW_GUEST_AUTH
        value: "false"
      - key: ABUSE_HASH_SECRET
        generateValue: true
      - key: REGISTRATION_IP_LIMIT
        value: "3"
      - key: DAILY_ROULETTE_IP_LIMIT
        value: "3"
      - key: MAX_CONNECTIONS_PER_IP
        value: "5"
      - key: MESSAGE_LIMIT_PER_10S
        value: "40"
      - key: STATE_ACTION_LIMIT_PER_10S
        value: "15"
