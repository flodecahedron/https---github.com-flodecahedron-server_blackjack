services:
  - type: web
    name: casino-royale-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - README.md
        - test/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.21.0"
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLOUD_PROJECT_NUMBER
        value: "92573100008"
      - key: PLAY_INTEGRITY_PACKAGE
        value: "com.bedealer.game"
      - key: PLAY_INTEGRITY_MODE
        value: "audit"
      - key: PLAY_INTEGRITY_REQUIRE_LICENSED
        value: "true"
      - key: PLAY_INTEGRITY_VERIFIED_TTL_MINUTES
        value: "30"
      - key: ALLOW_GUEST_AUTH
        value: "false"
      - key: ABUSE_HASH_SECRET
        generateValue: true
      - key: REGISTRATION_IP_LIMIT
        value: "3"
      - key: DAILY_ROULETTE_IP_LIMIT
        value: "3"
      - key: MAX_CONNECTIONS_PER_IP
        value: "5"
      - key: CONNECTION_MESSAGE_LIMIT_PER_10S
        value: "150"
      - key: ACCOUNT_MESSAGE_LIMIT_PER_10S
        value: "180"
      - key: IP_MESSAGE_LIMIT_PER_10S
        value: "300"
      - key: STATE_ACTION_LIMIT_PER_10S
        value: "30"
      - key: BET_ACTION_LIMIT_PER_10S
        value: "80"
      - key: LOG_WS_MESSAGES
        value: "false"
      - key: TRAFFIC_METRICS_INTERVAL_SECONDS
        value: "300"
      - key: CRASH_REPORTS_ENABLED
        value: "true"
      - key: CRASH_REPORTS_PER_ACCOUNT_PER_DAY
        value: "3"
      - key: CRASH_REPORTS_PER_IP_PER_DAY
        value: "20"
      - key: SESSION_TTL_DAYS
        value: "90"
      - key: SESSION_ROTATION_GRACE_MINUTES
        value: "5"
      - key: ALLOW_SIMULATED_REWARDED_GRANT
        value: "true"
      - key: REWARDED_GRANT_DAILY_LIMIT
        value: "100"
      - key: REWARDED_GRANT_COOLDOWN_MS
        value: "0"
